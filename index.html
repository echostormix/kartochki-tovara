<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточки товара</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="products">
    <article class="card">
      <img src="img/card-img-1.jpg" alt="Nova X" class="card__img">
      <h1 class="card__title">Nova X</h1>
      <p class="card__subtitle">OLED-дисплей и двойная камера</p>
      <div class="card__price">
        <p class="card__total">49 990 ₽</p>
        <button class="card__btn">Купить</button>
      </div>
    </article>
    <article class="card">
      <img src="img/card-img-2.jpg" alt="Sonic Pro" class="card__img">
      <h1 class="card__title">Sonic Pro</h1>
      <p class="card__subtitle">Полноразмерные беспроводные наушники с активным шумоподавлением, поддержкой быстрой зарядки и автономностью до 40 часов</p>
      <div class="card__price">
        <p class="card__total">12 490 ₽</p>
        <button class="card__btn">Купить</button>
      </div>
    </article>
    <article class="card">
      <img src="img/card-img-3.jpg" alt="Pulse Watch" class="card__img">
      <h1 class="card__title">Pulse Watch</h1>
      <p class="card__subtitle">Умные часы для спорта и отслеживания активности</p>
      <div class="card__price">
        <p class="card__total">18 990 ₽</p>
        <button class="card__btn">Купить</button>
      </div>
    </article>
  </div>
</body>
</html>
